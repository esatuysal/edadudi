<title>Dudu vs Bubu</title>
<style>
:root{--bg:#4a2620;--ink:#fff3f6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;padding:8px}
canvas{width:100%;max-width:960px;aspect-ratio:16/9;border:4px solid var(--ink);border-radius:14px;display:block;background:#ffd1dc}
p{margin:10px 0 0;font-size:14px;text-align:center;line-height:1.7;max-width:960px}
b{color:#ffd23d}
button{font:inherit;background:#ffd23d;border:0;border-radius:8px;padding:6px 14px;cursor:pointer;color:var(--bg);font-weight:bold}
button:focus-visible{outline:3px solid #fff}
</style>

<canvas id="c" width="960" height="540"></canvas>
<p><b>Dudu (Oyuncu 1):</b> A/D yürü, W zıpla, S blok, F yumruk, G tekme, H özel güç (Kaptan Çapası)<br>
<b>Bubu (Oyuncu 2):</b> ←/→ yürü, ↑ zıpla, ↓ blok, K yumruk, L tekme, J özel güç (Ağlama Tsunamisi)<br>
Özel güç barı vuruş yedikçe ve vurdukça dolar. Dolunca özel gücü kullan.<br>
<button id="cpu">Oyuncu 2: İnsan</button> <button id="rst">Yeniden başla (Enter)</button></p>

addEventListener('keyup',e=>keys[e.code]=false);
document.getElementById('cpu').onclick=e=>{cpu=!cpu;e.target.textContent='Oyuncu 2: '+(cpu?'Bilgisayar':'İnsan');full()};
document.getElementById('rst').onclick=()=>full();

function star(x,y,r){g.beginPath();for(let i=0;i<10;i++){const q=i*Math.PI/5-1.57,rr=i%2?r*.45:r;g.lineTo(x+Math.cos(q)*rr,y+Math.sin(q)*rr)}g.closePath();g.fill()}
function anchor(x,y,sc,rot){g.save();g.translate(x,y);g.rotate(rot);g.scale(sc,sc);g.lineCap='round';
  const d=()=>{g.beginPath();g.arc(0,-24,7,0,7);g.moveTo(0,-17);g.lineTo(0,24);g.moveTo(-12,-8);g.lineTo(12,-8);g.stroke();g.beginPath();g.arc(0,8,22,.15,Math.PI-.15);g.stroke()};
  g.strokeStyle=O;g.lineWidth=8;d();g.strokeStyle='#e9b949';g.lineWidth=4;d();g.restore()}
function limbs(f,o){
  const S=SP[f.id],ft=f.face;
  if(f.sp&&f.id==='dudu'){const s=Math.min(1,f.sp.t/26);
    if(f.sp.t<26){limb(f.x+ft*18,f.y-72,f.x+ft*22,f.y-170,22,O);limb(f.x+ft*18,f.y-72,f.x+ft*22,f.y-170,14,S.sleeve);anchor(f.x+ft*22,f.y-205-s*6,1.5,Math.sin(f.t*.3)*.2)}
    else{limb(f.x+ft*18,f.y-72,f.x+ft*70,f.y-100,22,O);limb(f.x+ft*18,f.y-72,f.x+ft*70,f.y-100,14,S.sleeve)}
    return}
  if(!f.atk)return;
  const s=ATK[f.type],p=1-Math.abs(f.atk/s.dur*2-1);
  g.strokeStyle=O;g.fillStyle=S.skin;
  if(f.type===1){const d=Math.abs(o.x-f.x),R=Math.max(70,Math.min(d-30,140)),sx=f.x+ft*24,sy=f.y-72,ex=f.x+ft*(p*(R+10)+22),ey=sy-p*24;
    limb(sx,sy,ex,ey,22,O);limb(sx,sy,ex,ey,14,S.sleeve);
    g.fillStyle=S.skin;g.lineWidth=4;g.beginPath();g.arc(ex+ft*6,ey,12+(p>.85?4:0),0,7);g.fill();g.stroke();
    if(p>.5)for(let i=0;i<3;i++)limb(f.x+ft*(10-i*8),ey-14+i*14,f.x+ft*(-24-i*8),ey-14+i*14,3,'rgba(255,255,255,.8)');
  }else{const hx=f.x+ft*10,hy=f.y-34,ex=f.x+ft*(14+p*118),ey=hy-p*42;
    limb(hx,hy,ex,ey,28,O);limb(hx,hy,ex,ey,20,S.pant);
    g.fillStyle=S.shoe;g.lineWidth=4;g.beginPath();g.ellipse(ex+ft*6,ey,16,11,0,0,7);g.fill();g.stroke()}
}
function bg(){
  const s=g.createLinearGradient(0,0,0,GY);s.addColorStop(0,'#ffc2d1');s.addColorStop(1,'#fff3f6');g.fillStyle=s;g.fillRect(-30,-30,W+60,H+60);
  g.fillStyle='#fff';for(const[x,y]of[[140,130],[480,100],[800,150]]){g.beginPath();g.arc(x,y,30,0,7);g.arc(x+34,y+7,22,0,7);g.arc(x-34,y+9,20,0,7);g.fill()}
  g.fillStyle='#ffe3ea';g.beginPath();g.moveTo(-30,GY);for(let i=0;i<=10;i++)g.lineTo(i*100,GY-70-(i%2)*45);g.lineTo(W+30,GY);g.fill();
  g.fillStyle='#f4a9bb';g.fillRect(-30,GY,W+60,H);g.fillStyle='#e88aa3';g.fillRect(-30,GY,W+60,6);
}
function surf(top){for(let x=0;x<=W;x+=20)g.lineTo(x,top+Math.sin(x*.03+fr*.08)*8)}
function drawWater(){
  water.lvl+=(water.tgt-water.lvl)*.04;const L=water.lvl;if(L<.01)return;const top=H*(1-L);
  g.fillStyle='rgba(30,130,255,'+(.3+L*.25)+')';g.beginPath();g.moveTo(0,H);g.lineTo(0,top);surf(top);g.lineTo(W,H);g.fill();
  g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=3;g.beginPath();g.moveTo(0,top);surf(top);g.stroke();
  g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=2;
  for(let i=0;i<16;i++){const hh=H*L,x=(i*137+Math.sin(fr*.03+i)*30+W)%W,y=H-((fr*(1+i%3)*.9+i*53)%hh);g.beginPath();g.arc(x,y,4+i%4*2,0,7);g.stroke()}
}
function drawWave(){
  if(!wave)return;const d=wave.dir,x0=wave.x,Hh=340;
  const gr=g.createLinearGradient(0,GY-Hh,0,GY+70);gr.addColorStop(0,'#bff0ff');gr.addColorStop(.3,'#4fb4ff');gr.addColorStop(1,'#1560c8');
  g.fillStyle=gr;g.globalAlpha=.9;g.beginPath();g.moveTo(x0,GY+70);
  for(let u=0;u<=1.001;u+=.04)g.lineTo(x0-d*u*520,GY-Hh*Math.pow(1-u,.7)*(.88+.12*Math.sin(u*18-fr*.3)));
  g.lineTo(x0-d*520,GY+70);g.closePath();g.fill();g.globalAlpha=1;
  g.fillStyle='#fff';for(let i=0;i<9;i++){const u=i*.03;g.beginPath();g.arc(x0-d*u*520,GY-Hh*Math.pow(1-u,.7)+Math.sin(i+fr*.3)*5,14-i,0,7);g.fill()}
}
function hud(){
  bar(24,a,'#d6894a','Dudu',false);bar(W-24-400,b,'#4fb0d4','Bubu',true);
  for(const[f,x,dx]of[[a,30,24],[b,W-30,-24]])for(let i=0;i<2;i++){g.fillStyle=i<f.wins?'#ffd23d':'#e8b8c4';g.strokeStyle=O;g.lineWidth=3;g.beginPath();g.arc(x+i*dx,92,8,0,7);g.fill();g.stroke()}
}
function bar(x,f,col,name,right){
  g.fillStyle=O;g.fillRect(x-4,18,408,36);g.fillStyle='#e8b8c4';g.fillRect(x,22,400,18);
  const w=400*f.hp/100;g.fillStyle=f.hp>30?col:'#ff4d4d';g.fillRect(right?x+400-w:x,22,w,18);
  const m=400*f.mp/100;g.fillStyle='#e8b8c4';g.fillRect(x,44,400,6);g.fillStyle=f.mp>=100?(fr%20<10?'#ffd23d':'#fff'):'#8a6af0';g.fillRect(right?x+400-m:x,44,m,6);
  g.fillStyle=O;g.font='bold 18px Trebuchet MS';g.textAlign=right?'right':'left';g.fillText(name+(f.mp>=100?'  ★ ÖZEL GÜÇ HAZIR':''),right?x+400:x,78);
}
function txt(s,x,y,sz,fill){g.font='bold '+sz+'px Trebuchet MS';g.textAlign='center';g.lineWidth=sz/5;g.strokeStyle=O;g.lineJoin='round';g.strokeText(s,x,y);g.fillStyle=fill;g.fillText(s,x,y)}

function loop(){
  fr++;
  if(freeze>0)freeze--;
  else{
    ctl(a,b,KA,false);ctl(b,a,KB,cpu);phys(a,b);phys(b,a);
    if(Math.abs(a.x-b.x)<60&&a.y>=GY-5&&b.y>=GY-5&&!a.ko&&!b.ko){const s=a.x<b.x?-1:1;a.x+=s*3;b.x-=s*3}
    for(const p of projs){p.x+=p.vx;p.rot+=.4*p.face;const o=p.own===a?b:a;
      if(!p.dead&&Math.abs(p.x-o.x)<55&&Math.abs(p.y-(o.y-95))<90&&!o.ko){p.dead=true;hurt(p.own,o,28,40,10,true)}
      if(Math.abs(p.x-W/2)>W/2+80)p.dead=true}
    projs=projs.filter(p=>!p.dead);
    if(wave){wave.x+=wave.dir*17;const o=wave.own===a?b:a;
      if(!wave.hit&&(wave.x-o.x)*wave.dir>=0&&!o.ko){wave.hit=true;hurt(wave.own,o,35,70,12,true);o.vy=-13;o.spin=60}
      if(wave.x<-560||wave.x>W+560){wave=null;water.tgt=0}}
    for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.l--}parts=parts.filter(p=>p.l>0);
    for(const t of texts){t.t--;t.y-=1}texts=texts.filter(t=>t.t>0);
    if(!over&&(a.hp<=0||b.hp<=0)){over=true;const w=a.hp<=0?b:a,l=a.hp<=0?a:b;l.ko=true;l.vy=-10;l.vx=-w.face*5;w.wins++;projs=[];
      if(w.wins>=2){match=true;msg=(w.id==='dudu'?'Dudu':'Bubu')+' kazandı!   Enter: yeni maç'}else msg='K.O.!';msgT=9999;snd(80,.6,'sawtooth',.3)}
    if(over&&!match&&++overT>170){round++;begin()}
    if(msgT>0&&msgT<9999)msgT--;
  }
  g.save();if(shake>0){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85}
  bg();drawF(a);limbs(a,b);drawF(b);limbs(b,a);
  for(const p of projs)anchor(p.x,p.y,1.7,p.rot);
  drawWater();drawWave();
  for(const p of parts){g.globalAlpha=p.l/22;g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()}g.globalAlpha=1;
  g.restore();
  for(const t of texts){g.globalAlpha=Math.min(1,t.t/20);txt(t.s,t.x,t.y,t.big?34:26,t.c)}g.globalAlpha=1;
  hud();if(msgT>0)txt(msg,W/2,210,msgT===9999?54:46,'#ffd23d');
  requestAnimationFrame(loop);
}
</script>
