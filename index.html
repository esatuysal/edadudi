<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dudu vs Bubu</title>
<style>
:root{--bg:#4a2620;--ink:#fff3f6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;padding:8px}
canvas{width:100%;max-width:960px;aspect-ratio:16/9;border:4px solid var(--ink);border-radius:14px;display:block;background:#ffd1dc}
p{margin:10px 0 0;font-size:14px;text-align:center;line-height:1.7;max-width:960px}
b{color:#ffd23d}
button{font:inherit;background:#ffd23d;border:0;border-radius:8px;padding:6px 14px;cursor:pointer;color:var(--bg);font-weight:bold}
button:focus-visible{outline:3px solid #fff}
body{touch-action:manipulation}
#touch{display:none;width:100%;max-width:960px;justify-content:space-between;align-items:center;padding:14px 10px 6px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#joy{position:relative;width:150px;height:150px;border-radius:50%;background:rgba(255,243,246,.15);border:3px solid var(--ink);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:var(--ink);opacity:.85}
#btns{display:grid;grid-template-columns:auto auto;gap:12px}
#btns button{width:84px;height:84px;border-radius:50%;font-size:15px;touch-action:none}
#btns button.on{transform:scale(.92);background:#fff}
#btns button.rdy{background:#7fd1ff;box-shadow:0 0 0 4px #fff}
@media (hover:none) and (pointer:coarse){#touch{display:flex}.kb{display:none}}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<p class="kb"><b>Dudu (Oyuncu 1):</b> A/D yürü, W zıpla, S blok, F yumruk, G tekme, H özel güç (Kaptan Çapası)<br>
<b>Bubu (Oyuncu 2):</b> ←/→ yürü, ↑ zıpla, ↓ blok, K yumruk, L tekme, J özel güç (Ağlama Tsunamisi)<br>
Özel güç barı vuruş yedikçe ve vurdukça dolar. Dolunca özel gücü kullan.</p>
<div id="touch"><div id="joy"><div id="knob"></div></div><div id="btns"><button data-k="KeyF">Yumruk</button><button data-k="KeyG">Tekme</button><button data-k="KeyS">Blok</button><button data-k="KeyH">Özel</button></div></div>
<p><button id="cpu">Oyuncu 2: İnsan</button> <button id="rst">Yeniden başla (Enter)</button></p>
<script>
const spBtn=document.querySelector('[data-k=KeyH]');
const joy=document.getElementById('joy'),knob=document.getElementById('knob');let jid=null;
function jset(e){const r=joy.getBoundingClientRect();let dx=(e.clientX-r.left-r.width/2)/(r.width/2),dy=(e.clientY-r.top-r.height/2)/(r.height/2);const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}
  knob.style.transform='translate('+dx*45+'px,'+dy*45+'px)';keys.KeyA=dx<-.35;keys.KeyD=dx>.35;keys.KeyW=dy<-.55;keys.KeyS=dy>.55}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jset(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jset(e)});
const jend=e=>{if(e.pointerId===jid){jid=null;knob.style.transform='';keys.KeyA=keys.KeyD=keys.KeyW=keys.KeyS=false}};
joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
document.querySelectorAll('#btns button').forEach(bt=>{const k=bt.dataset.k,up=()=>{keys[k]=false;bt.classList.remove('on')};
  bt.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;bt.classList.add('on')});
  bt.addEventListener('pointerup',up);bt.addEventListener('pointercancel',up);bt.addEventListener('pointerleave',up)});
document.addEventListener('contextmenu',e=>e.preventDefault());
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=960,H=540,GY=470,K=.68,O='#4a2620';
const keys={};let cpu=matchMedia('(hover:none) and (pointer:coarse)').matches,fr=0,freeze=0,shake=0,over=false,overT=0,round=1,msg='',msgT=0,match=false;
let parts=[],texts=[],projs=[],fx=[],wave=null,a,b;const water={lvl:0,tgt:0};
addEventListener('keydown',e=>{keys[e.code]=true;if(/Arrow|Space/.test(e.code))e.preventDefault();if(e.code==='Enter')full()});
addEventListener('keyup',e=>keys[e.code]=false);
if(cpu)document.getElementById('cpu').textContent='Oyuncu 2: Bilgisayar';
document.getElementById('cpu').onclick=e=>{cpu=!cpu;e.target.textContent='Oyuncu 2: '+(cpu?'Bilgisayar':'İnsan');full()};
document.getElementById('rst').onclick=()=>full();
let ac;function snd(f,d,t='sine',v=.2,s=.4){try{ac=ac||new AudioContext();const o=ac.createOscillator(),n=ac.createGain(),T=ac.currentTime;o.type=t;o.frequency.setValueAtTime(f,T);o.frequency.exponentialRampToValueAtTime(Math.max(30,f*s),T+d);n.gain.setValueAtTime(v,T);n.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(n);n.connect(ac.destination);o.start();o.stop(T+d)}catch(e){}}

const SPRITE1='sprite1.png',SPRITE2='sprite2.png',SS=3,DS=2.7; // sheet 3x büyütülmüş, kareler orijinal koordinatlarla
const FR={"dudu":{"idle":[[39,27,49,76,24.5,74],[132,26,51,77,25.5,75],[225,26,52,77,26.0,75],[319,26,52,77,26.0,75],[414,26,51,77,25.5,75]],"walk":[[40,120,49,73,24.5,71],[135,118,48,77,24.0,75],[228,118,49,78,24.5,76],[320,119,50,77,25.0,75],[417,119,48,77,24.0,75]],"punch":[[41,211,47,68,25.0,66],[135,206,51,76,25.0,74],[228,207,53,75,25.0,73],[322,207,53,75,25.0,73],[417,206,56,75,25.0,73]],"kick":[[41,296,47,68,25.0,66],[132,288,48,77,25.0,75],[222,287,56,78,25.0,76],[315,287,57,78,25.0,76],[410,287,58,78,25.0,76]],"block":[[132,370,46,71,23.0,69],[231,369,47,72,23.5,70],[323,369,56,74,28.0,72]],"hurt":[[123,440,51,72,25.5,70],[202,440,58,72,29.0,70],[277,439,75,73,37.5,71],[381,439,77,73,38.5,71]],"ko":[[101,520,78,47,39.0,45],[194,514,78,53,39.0,51],[291,515,83,53,41.5,51],[395,518,89,51,44.5,49]]},"bubu":{"idle":[[551,32,51,71,25.5,69],[647,32,50,71,25.0,69],[741,32,51,71,25.5,69],[837,32,50,71,25.0,69],[932,32,51,71,25.5,69]],"walk":[[552,124,49,69,24.5,67],[648,124,49,72,24.5,70],[742,124,49,72,24.5,70],[837,124,50,72,25.0,70],[933,124,49,72,24.5,70]],"punch":[[552,213,54,65,25.0,63],[648,213,54,68,25.0,66],[743,213,55,68,25.0,66],[838,213,54,69,25.0,67],[933,213,54,68,25.0,66]],"kick":[[552,298,48,66,25.0,64],[648,296,52,70,25.0,68],[742,295,53,71,25.0,69],[837,295,53,71,25.0,69],[932,296,48,70,25.0,68]],"block":[[654,376,47,66,23.5,64],[750,375,47,67,23.5,65],[845,374,47,67,23.5,65]],"hurt":[[636,441,60,71,30.0,69],[721,440,62,72,31.0,70],[814,444,86,67,43.0,65]],"ko":[[560,522,84,47,42.0,45],[670,515,84,52,42.0,50],[781,517,85,51,42.5,49],[900,523,83,46,41.5,44]]}};
const sheet=new Image(),sheet2=new Image();
sheet.onload=()=>{full();loop()};
sheet.onerror=()=>document.body.insertAdjacentHTML('afterbegin','<p><b>sprite1.png bulunamadı.</b> index.html ile aynı klasöre koy.</p>');
sheet.src=SPRITE1;sheet2.onerror=()=>{};sheet2.src=SPRITE2;
const ATK={1:{dur:22,hit:9,reach:125,dmg:7,st:16,kb:5},2:{dur:30,hit:13,reach:150,dmg:11,st:22,kb:9}};
const mk=(id,x,face)=>({id,x,y:GY,vx:0,vy:0,face,hp:100,mp:0,atk:0,type:0,hit:false,stun:0,wins:0,t:0,cd:0,blk:false,sp:null,ln:0,spin:0,ko:false,hh:false,bt:0,sm:1,koT:0});
function full(){round=1;match=false;a=mk('dudu',280,1);b=mk('bubu',680,-1);begin()}
function begin(){const wa=a.wins|0,wb=b.wins|0;a=mk('dudu',280,1);b=mk('bubu',680,-1);a.wins=wa;b.wins=wb;projs=[];wave=null;parts=[];texts=[];fx=[];water.tgt=0;water.lvl=0;over=false;overT=0;msg='Round '+round+' — Dövüş!';msgT=100}

function start(f,t){if(f.atk||f.stun||f.sp||over)return;f.atk=ATK[t].dur;f.type=t;f.hit=false;snd(500,.12,'triangle',.06,.3)}
function spec(f){if(f.mp<100||f.atk||f.stun||f.sp||over)return;f.mp=0;f.sp={t:0};texts.push({x:f.x,y:f.y-250,t:70,s:f.id==='dudu'?'Kaptan Çapası!':'Ağlama Tsunamisi!',c:'#fff',big:true})}
const KA={L:'KeyA',R:'KeyD',U:'KeyW',D:'KeyS',P:'KeyF',K:'KeyG',S:'KeyH'},KB={L:'ArrowLeft',R:'ArrowRight',U:'ArrowUp',D:'ArrowDown',P:'KeyK',K:'KeyL',S:'KeyJ'};
function ctl(f,o,k,ai){
  f.blk=false;if(f.stun||over||f.sp||f.ko)return;
  let m=0;
  if(ai){const d=o.x-f.x,ad=Math.abs(d);f.cd--;
    if(f.mp>=100&&!f.atk&&Math.random()<.02)spec(f);
    if(ad>120)m=Math.sign(d);else if(ad<80)m=-Math.sign(d)*(Math.random()<.4?1:0);
    if(o.atk&&ad<180&&Math.random()<.1&&f.y>=GY)f.blk=true;
    if(f.cd<=0&&ad<150&&!f.atk&&!f.blk){start(f,Math.random()<.55?1:2);f.cd=30+Math.random()*35}
    if(Math.random()<.006&&f.y>=GY)f.vy=-17;
  }else{
    if(keys[k.L])m=-1;if(keys[k.R])m=1;
    if(keys[k.U]&&f.y>=GY)f.vy=-17;
    f.blk=!!keys[k.D]&&f.y>=GY;
    if(keys[k.P])start(f,1);if(keys[k.K])start(f,2);if(keys[k.S])spec(f);
  }
  if(f.blk)m=0;
  if(!f.atk||f.y<GY)f.vx=m*4.6;else f.vx*=.8;
}
function hurt(att,def,dmg,st,kb,big){
  const blocked=def.blk&&def.face===-att.face&&!big;
  if(blocked){dmg*=.2;st=6;kb*=.4}
  def.hp=Math.max(0,def.hp-dmg);def.stun=st;def.vx=att.face*kb;if(!blocked)def.vy=-5-(big?5:0);
  if(def.sp&&def.id==='bubu'){def.sp=null;water.tgt=0}
  def.sp=null;def.atk=0;def.hh=!blocked;
  att.mp=Math.min(100,att.mp+8);if(!blocked)def.mp=Math.min(100,def.mp+6);
  freeze=big?10:5;shake=big?22:9;
  const px=def.x-att.face*8,py=def.y-125;fx.push({x:px,y:py,t:16,big});def.sm=st;
  for(let i=0;i<(big?26:12);i++){const an=Math.random()*6.28,s=3+Math.random()*(big?10:6);parts.push({x:px,y:py,vx:Math.cos(an)*s,vy:Math.sin(an)*s,l:22,c:blocked?'#9cd':['#fff','#ffd23d','#ff7a8a'][i%3],r:3+Math.random()*3})}
  texts.push({x:px,y:py-70,t:36,s:blocked?'BLOK':Math.round(dmg),c:blocked?'#fff':'#ff4d4d',big});
  snd(big?90:150,big?.35:.15,'square',.3);
}
function phys(f,o){
  f.t++;if(f.ko)f.koT++;f.bt=f.blk?f.bt+1:0;
  if(!f.sp&&!f.stun&&!f.atk&&!f.ko)f.face=o.x>f.x?1:-1;
  f.vy+=.9;f.x+=f.vx;f.y+=f.vy;if(f.y>GY){f.y=GY;f.vy=0;if(f.ko||f.stun)f.vx*=.8}
  f.x=Math.max(80,Math.min(W-80,f.x));
  if(f.stun>0){f.stun--;f.vx*=.9}else f.hh=false;
  if(f.spin>0)f.spin--;
  if(f.atk){const s=ATK[f.type],el=s.dur-f.atk;
    if(el===s.hit&&!f.hit){const dx=(o.x-f.x)*f.face;if(dx>0&&dx<s.reach&&Math.abs(o.y-f.y)<80&&!o.ko){f.hit=true;hurt(f,o,s.dmg,s.st,s.kb,false)}}
    f.atk--}
  if(f.sp){const s=f.sp;s.t++;f.vx=0;
    if(f.id==='dudu'){if(s.t===26){projs.push({x:f.x+f.face*50,y:f.y-125,vx:f.face*16,rot:0,own:f,face:f.face});snd(300,.3,'sawtooth',.2,.5)}if(s.t>42)f.sp=null}
    else{if(s.t%2===0)for(const q of[-1,1])parts.push({x:f.x+f.face*14+q*16,y:f.y-150,vx:q*2+Math.random(),vy:-2,l:26,c:'#4fb4ff',r:4});
      if(s.t===1){water.tgt=.5;snd(900,.6,'sine',.12,.4)}
      if(s.t===85){wave={x:f.x,dir:f.face,hit:false,own:f};snd(70,1.4,'sawtooth',.35,.6)}
      if(s.t>105)f.sp=null}}
}
function frame(f,name,i,dy){const L=FR[f.id][name],r=L[Math.min(i,L.length-1)];
  g.drawImage(sheet,r[0]*SS,r[1]*SS,r[2]*SS,r[3]*SS,-r[4]*DS,-r[5]*DS+dy,r[2]*DS,r[3]*DS)}
function anim(f){
  const t=f.t;
  if(f.ko)return['ko',Math.min(3,f.koT>>3)];
  if(f.stun){if(!f.hh)return['block',2];const n=FR[f.id].hurt.length;return['hurt',Math.min(n-1,Math.floor((1-f.stun/f.sm)*n))]}
  if(f.sp)return f.id==='dudu'?(f.sp.t<26?['idle',1]:['punch',4]):['hurt',1];
  if(f.atk){const s=ATK[f.type],el=s.dur-f.atk;let i;
    if(el<s.hit)i=Math.floor(el/s.hit*4);else if(el<s.hit+6)i=4;else i=Math.max(1,4-Math.floor((el-s.hit-5)/3));
    return[f.type===1?'punch':'kick',i]}
  if(over)return['idle',(t>>3)%5];
  if(f.y<GY-2)return['walk',2];
  if(f.blk)return['block',Math.min(2,f.bt>>2)];
  if(Math.abs(f.vx)>.5)return['walk',(t>>2)%5];
  return['idle',(t>>4)%5]}
function drawF(f){
  const[n,i]=anim(f),jx=f.stun?(Math.random()-.5)*5:0;let bob=0;
  if(over&&!f.ko)bob=-Math.abs(Math.sin(f.t*.2))*34;
  if(f.sp&&f.id==='bubu')bob=-Math.abs(Math.sin(f.t*.5))*6;
  g.fillStyle='rgba(74,38,32,.18)';g.beginPath();g.ellipse(f.x,GY+4,Math.max(20,60-(GY-f.y)*.1),10,0,0,7);g.fill();
  g.save();g.translate(f.x+jx,f.y+bob);
  if(f.spin>0){g.translate(0,-100);g.rotate(-f.spin*.35*f.face);g.translate(0,100)}
  g.scale(f.face,1);frame(f,n,i,0);g.restore();
}
function burst(e){const k=e.t/16,r=(e.big?95:58)*(1.25-k*.5);g.save();g.translate(e.x,e.y);g.rotate(e.t*.08);g.globalAlpha=Math.min(1,k*2);
  const sp=(rr,c)=>{g.fillStyle=c;g.beginPath();for(let i=0;i<16;i++){const q=i*Math.PI/8,d=i%2?rr*.55:rr;i?g.lineTo(Math.cos(q)*d,Math.sin(q)*d):g.moveTo(Math.cos(q)*d,Math.sin(q)*d)}g.closePath();g.fill();g.stroke()};
  g.strokeStyle=O;g.lineWidth=4;sp(r,'#ffd23d');sp(r*.55,'#fff');g.restore()}
function anchor(x,y,sc,rot){g.save();g.translate(x,y);g.rotate(rot);g.scale(sc,sc);g.lineCap='round';
  const d=()=>{g.beginPath();g.arc(0,-24,7,0,7);g.moveTo(0,-17);g.lineTo(0,24);g.moveTo(-12,-8);g.lineTo(12,-8);g.stroke();g.beginPath();g.arc(0,8,22,.15,Math.PI-.15);g.stroke()};
  g.strokeStyle=O;g.lineWidth=8;d();g.strokeStyle='#e9b949';g.lineWidth=4;d();g.restore()}
function limbs(f){
  if(!(f.sp&&f.id==='dudu'&&f.sp.t<26))return;
  anchor(f.x+f.face*10,f.y-238-Math.min(1,f.sp.t/20)*8,1.5,Math.sin(f.t*.3)*.2)}
function bg(){
  const s=g.createLinearGradient(0,0,0,GY);s.addColorStop(0,'#ffc2d1');s.addColorStop(1,'#fff3f6');g.fillStyle=s;g.fillRect(-30,-30,W+60,H+60);
  g.fillStyle='#fff';for(const[x,y]of[[140,130],[480,100],[800,150]]){g.beginPath();g.arc(x,y,30,0,7);g.arc(x+34,y+7,22,0,7);g.arc(x-34,y+9,20,0,7);g.fill()}
  g.fillStyle='#ffe3ea';g.beginPath();g.moveTo(-30,GY);for(let i=0;i<=10;i++)g.lineTo(i*100,GY-70-(i%2)*45);g.lineTo(W+30,GY);g.fill();
  g.fillStyle='#f4a9bb';g.fillRect(-30,GY,W+60,H);g.fillStyle='#e88aa3';g.fillRect(-30,GY,W+60,6);
}
function surf(top){for(let x=0;x<=W;x+=20)g.lineTo(x,top+Math.sin(x*.03+fr*.08)*8)}
function drawWater(){
  water.lvl+=(water.tgt-water.lvl)*.04;const L=water.lvl;if(L<.01)return;const top=H*(1-L);
  g.fillStyle='rgba(30,130,255,'+(.3+L*.25)+')';g.beginPath();g.moveTo(0,H);g.lineTo(0,top);surf(top);g.lineTo(W,H);g.fill();
  g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=3;g.beginPath();g.moveTo(0,top);surf(top);g.stroke();
  g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=2;
  for(let i=0;i<16;i++){const hh=H*L,x=(i*137+Math.sin(fr*.03+i)*30+W)%W,y=H-((fr*(1+i%3)*.9+i*53)%hh);g.beginPath();g.arc(x,y,4+i%4*2,0,7);g.stroke()}
}
function drawWave(){
  if(!wave)return;const d=wave.dir,x0=wave.x,Hh=340;
  const gr=g.createLinearGradient(0,GY-Hh,0,GY+70);gr.addColorStop(0,'#bff0ff');gr.addColorStop(.3,'#4fb4ff');gr.addColorStop(1,'#1560c8');
  g.fillStyle=gr;g.globalAlpha=.9;g.beginPath();g.moveTo(x0,GY+70);
  for(let u=0;u<=1.001;u+=.04)g.lineTo(x0-d*u*520,GY-Hh*Math.pow(1-u,.7)*(.88+.12*Math.sin(u*18-fr*.3)));
  g.lineTo(x0-d*520,GY+70);g.closePath();g.fill();g.globalAlpha=1;
  g.fillStyle='#fff';for(let i=0;i<9;i++){const u=i*.03;g.beginPath();g.arc(x0-d*u*520,GY-Hh*Math.pow(1-u,.7)+Math.sin(i+fr*.3)*5,14-i,0,7);g.fill()}
}
function hud(){
  bar(24,a,'#d6894a','Dudu',false);bar(W-24-400,b,'#4fb0d4','Bubu',true);
  for(const[f,x,dx]of[[a,30,24],[b,W-30,-24]])for(let i=0;i<2;i++){g.fillStyle=i<f.wins?'#ffd23d':'#e8b8c4';g.strokeStyle=O;g.lineWidth=3;g.beginPath();g.arc(x+i*dx,92,8,0,7);g.fill();g.stroke()}
}
function bar(x,f,col,name,right){
  g.fillStyle=O;g.fillRect(x-4,18,408,36);g.fillStyle='#e8b8c4';g.fillRect(x,22,400,18);
  const w=400*f.hp/100;g.fillStyle=f.hp>30?col:'#ff4d4d';g.fillRect(right?x+400-w:x,22,w,18);
  const m=400*f.mp/100;g.fillStyle='#e8b8c4';g.fillRect(x,44,400,6);g.fillStyle=f.mp>=100?(fr%20<10?'#ffd23d':'#fff'):'#8a6af0';g.fillRect(right?x+400-m:x,44,m,6);
  g.fillStyle=O;g.font='bold 18px Trebuchet MS';g.textAlign=right?'right':'left';g.fillText(name+(f.mp>=100?'  ★ ÖZEL GÜÇ HAZIR':''),right?x+400:x,78);
}
function txt(s,x,y,sz,fill){g.font='bold '+sz+'px Trebuchet MS';g.textAlign='center';g.lineWidth=sz/5;g.strokeStyle=O;g.lineJoin='round';g.strokeText(s,x,y);g.fillStyle=fill;g.fillText(s,x,y)}

function loop(){
  fr++;
  if(freeze>0)freeze--;
  else{
    ctl(a,b,KA,false);ctl(b,a,KB,cpu);phys(a,b);phys(b,a);
    if(Math.abs(a.x-b.x)<85&&a.y>=GY-5&&b.y>=GY-5&&!a.ko&&!b.ko){const s=a.x<b.x?-1:1;a.x+=s*3;b.x-=s*3}
    for(const p of projs){p.x+=p.vx;p.rot+=.4*p.face;const o=p.own===a?b:a;
      if(!p.dead&&Math.abs(p.x-o.x)<55&&Math.abs(p.y-(o.y-95))<90&&!o.ko){p.dead=true;hurt(p.own,o,28,40,10,true)}
      if(Math.abs(p.x-W/2)>W/2+80)p.dead=true}
    projs=projs.filter(p=>!p.dead);
    if(wave){wave.x+=wave.dir*17;const o=wave.own===a?b:a;
      if(!wave.hit&&(wave.x-o.x)*wave.dir>=0&&!o.ko){wave.hit=true;hurt(wave.own,o,35,70,12,true);o.vy=-13;o.spin=60}
      if(wave.x<-560||wave.x>W+560){wave=null;water.tgt=0}}
    for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.l--}parts=parts.filter(p=>p.l>0);
    for(const t of texts){t.t--;t.y-=1}texts=texts.filter(t=>t.t>0);for(const e of fx)e.t--;fx=fx.filter(e=>e.t>0);
    if(!over&&(a.hp<=0||b.hp<=0)){over=true;const w=a.hp<=0?b:a,l=a.hp<=0?a:b;l.ko=true;l.vy=-10;l.vx=-w.face*5;w.wins++;projs=[];
      if(w.wins>=2){match=true;msg=(w.id==='dudu'?'Dudu':'Bubu')+' kazandı!   Enter: yeni maç'}else msg='K.O.!';msgT=9999;snd(80,.6,'sawtooth',.3)}
    if(over&&!match&&++overT>170){round++;begin()}
    if(msgT>0&&msgT<9999)msgT--;
  }
  g.save();if(shake>0){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85}
  bg();drawF(a);drawF(b);limbs(a);limbs(b);
  for(const p of projs)anchor(p.x,p.y,1.7,p.rot);
  drawWater();drawWave();for(const e of fx)burst(e);spBtn.classList.toggle('rdy',a.mp>=100);
  for(const p of parts){g.globalAlpha=Math.min(1,p.l/22);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()}g.globalAlpha=1;
  g.restore();
  for(const t of texts){g.globalAlpha=Math.min(1,t.t/20);txt(t.s,t.x,t.y,t.big?34:26,t.c)}g.globalAlpha=1;
  hud();if(msgT>0)txt(msg,W/2,210,msgT===9999?54:46,'#ffd23d');
  requestAnimationFrame(loop);
}
